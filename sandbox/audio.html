<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neon-Racer sound bench</title>
    <link rel="icon" href="data:," />
    <style>
      :root { --bg: #07020f; --panel: #110a1f; --line: #2a1f45; --fg: #f1ecff; --dim: #9a8fbf; --teal: #16e0bd; --pink: #ff2e9a; --amber: #ffb02e; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.45 system-ui, 'Segoe UI', sans-serif; }
      main { max-width: 1280px; margin: 0 auto; padding: 14px 16px 40px; }
      header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 12px; }
      h1 { margin: 0 12px 0 0; font-size: 20px; letter-spacing: 0.06em; text-shadow: 0 0 12px var(--pink); }
      h2 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--teal); text-shadow: 0 0 8px rgba(22, 224, 189, 0.5); }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 12px; }
      .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; min-width: 0; }
      select, button { background: #1a1030; color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font: inherit; }
      button { cursor: pointer; }
      button:hover { border-color: var(--teal); }
      button:disabled { opacity: 0.5; cursor: wait; }
      button.go { background: var(--pink); border-color: var(--pink); font-weight: 600; box-shadow: 0 0 14px rgba(255, 46, 154, 0.45); }
      button.on { border-color: var(--teal); box-shadow: 0 0 8px rgba(22, 224, 189, 0.5); }
      .btns { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
      label { color: var(--dim); display: inline-flex; align-items: center; gap: 6px; }
      input[type='range'] { accent-color: var(--teal); width: 140px; }
      .status { color: var(--dim); font-variant-numeric: tabular-nums; }
      .status b { color: var(--fg); font-weight: 600; }
      .status .warn { color: var(--amber); }
      pre { margin: 6px 0 0; font: 12px/1.5 ui-monospace, Consolas, monospace; white-space: pre-wrap; color: var(--fg); }
      pre.dim { color: var(--dim); }
      canvas { width: 100%; height: auto; display: block; border-radius: 6px; background: #000; }
      .mt { margin-top: 12px; }
      a.dl { color: var(--teal); align-self: center; }
      .hint { color: var(--dim); font-size: 12px; margin: 8px 0 0; }
      table { border-collapse: collapse; width: 100%; font: 12px/1.5 ui-monospace, Consolas, monospace; font-variant-numeric: tabular-nums; }
      td, th { padding: 2px 6px; text-align: right; border-bottom: 1px solid var(--line); }
      td:first-child, th:first-child { text-align: left; }
      th { color: var(--dim); font-weight: 500; }
      @media (max-width: 600px) { main { padding: 10px 16px 30px; } h1 { font-size: 17px; } }
    </style>
  </head>
  <body>
    <main id="app">loading the sound bench…</main>
    <script type="module" src="./audio.ts"></script>
  </body>
</html>
